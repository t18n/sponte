[project]
name = "sponte"
version = "0.1.0"
description = "Orchestration CLI for AFK agent loops: markdown task store, git worktrees, official harness CLIs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sponte contributors" }]
requires-python = ">=3.11"
keywords = ["agents", "automation", "cli", "git", "worktrees"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.scripts]
sponte = "ralph_focus.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[project.urls]
Homepage = "https://github.com/t18n/sponte"
Repository = "https://github.com/t18n/sponte"
Issues = "https://github.com/t18n/sponte/issues"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ralph_focus", "config"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"

[tool.hatch.build.targets.sdist]
include = [
  "ralph_focus",
  "config",
  "prompts",
  "CONTRIBUTING.md",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "pyproject.toml",
]
