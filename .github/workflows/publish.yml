name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$REF_NAME" =~ ^v ]]; then
            echo "Expected tag like v1.2.3, got: $REF_NAME"
            exit 1
          fi
          TAG_VER="${REF_NAME#v}"
          PYVER="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          if [ "$TAG_VER" != "$PYVER" ]; then
            echo "Mismatch: git tag is $REF_NAME (version $TAG_VER) but pyproject.toml has version $PYVER"
            exit 1
          fi
          echo "Version check OK: $PYVER"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
